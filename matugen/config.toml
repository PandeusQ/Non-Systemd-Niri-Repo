[config]
reload_apps = true

[templates.niri]
input_path = "~/.config/matugen/templates/niri-colors.kdl"
output_path = "~/.config/niri/colors.kdl"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.wofi]
input_path = "~/.config/matugen/templates/wofi-colors.css"
output_path = "~/.config/wofi/colors.css"

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch.json"
output_path = "~/.config/fastfetch/config.jsonc"

[templates.gtk]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.cava]
input_path = "~/.config/matugen/templates/cava"
output_path = "~/.config/cava/config"
post_hook = "pkill -USR1 cava || true"

